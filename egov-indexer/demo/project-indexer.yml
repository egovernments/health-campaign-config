ServiceMaps:
  serviceName: Project Service
  version: 1.0.0
  mappings:
    - topic: demo-transformer-producer-bulk-project-index-v1-topic
      configKey: INDEX
      indexes:
        - name: demo-project-index-v1
          type: projects
          id: $.id
          isBulk: true
          jsonPath: $
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
          timeStampField: $.createdTime
    - topic: demo-save-project-beneficiary-topic
      configKey: INDEX
      indexes:
        - name: demo-project-beneficiary-index-v1
          type: project-beneficiary
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.createdTime
    - topic: demo-update-project-beneficiary-topic
      configKey: INDEX
      indexes:
        - name: demo-project-beneficiary-index-v1
          type: project-beneficiary
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
    - topic: demo-delete-project-beneficiary-topic
      configKey: INDEX
      indexes:
        - name: demo-project-beneficiary-index-v1
          type: project-beneficiary
          id: $.id
