ServiceMaps:
  serviceName: project
  version: 1.0.0
  mappings:
    - topic: demo-transformed-errors-topic
      configKey: INDEX
      indexes:
        - name: demo-transformed-errors-index-v1
          type: errors
          id: $.id
          isBulk: true
          jsonPath: $
          customJsonMapping:
            indexMapping:
              Data: {}
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
          timeStampField: $.auditDetails.createdTime
