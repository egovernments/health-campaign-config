ServiceMaps:
  serviceName: facility
  version: 1.0.0
  mappings:
    - topic: demo-save-facility-topic
      configKey: INDEX
      indexes:
        - name: demo-facility-index-v1
          type: facility
          id: $.clientReferenceId
          isBulk: true
          jsonPath: "$[?(@.usage nin ['OUTSIDE_HOUSEHOLD_PLACES','TRANSIT_POST'])]"
          timeStampField: $.auditDetails.createdTime
        # Outside household sites (facilities whose usage is a site type of MDMS HCM.OUTSIDE_HOUSEHOLD_TYPES; keep this list in step with it) get their own index
        - name: demo-outside-household-index-v1
          type: outside-household
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.usage in ['OUTSIDE_HOUSEHOLD_PLACES','TRANSIT_POST'])]"
          timeStampField: $.auditDetails.createdTime
    - topic: demo-update-facility-topic
      configKey: INDEX
      indexes:
        - name: demo-facility-index-v1
          type: facility
          id: $.clientReferenceId
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
        - name: demo-outside-household-index-v1
          type: outside-household
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.usage in ['OUTSIDE_HOUSEHOLD_PLACES','TRANSIT_POST'])]"
          timeStampField: $.auditDetails.lastModifiedTime
