ServiceMaps:
  serviceName: Project Service
  version: 1.0.0
  mappings:
    - topic: demo-transformer-producer-bulk-project-index-v1-topic
      configKey: INDEX
      indexes:
        - name: demo-project-index-v1
          type: projects
          id: $.id
          isBulk: true
          jsonPath: $
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
          timeStampField: $.createdTime
    - topic: demo-save-project-beneficiary-topic
      configKey: INDEX
      indexes:
        - name: demo-project-beneficiary-index-v1
          type: project-beneficiary
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.createdTime
    - topic: demo-update-project-beneficiary-topic
      configKey: INDEX
      indexes:
        - name: demo-project-beneficiary-index-v1
          type: project-beneficiary
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
    - topic: demo-delete-project-beneficiary-topic
      configKey: INDEX
      indexes:
        - name: demo-project-beneficiary-index-v1
          type: project-beneficiary
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
    - topic: demo-save-project-resource-topic
      configKey: INDEX
      indexes:
        - name: demo-project-resource-index-v1
          type: project-resource
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.createdTime
    - topic: demo-update-project-resource-topic
      configKey: INDEX
      indexes:
        - name: demo-project-resource-index-v1
          type: project-resource
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
    - topic: demo-delete-project-resource-topic
      configKey: INDEX
      indexes:
        - name: demo-project-resource-index-v1
          type: project-resource
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
    - topic: demo-save-project-facility-topic
      configKey: INDEX
      indexes:
        - name: demo-project-facility-index-v1
          type: project-facility
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema != 'OutsideHouseholdAssignment')]"
          timeStampField: $.auditDetails.createdTime
        - name: demo-outside-household-index-v1
          type: outside-household-campaign
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema == 'OutsideHouseholdAssignment')]"
          timeStampField: $.auditDetails.createdTime
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $.id
                outJsonPath: $.Data.id
              - inJsonPath: $.tenantId
                outJsonPath: $.Data.tenantId
              - inJsonPath: $.projectId
                outJsonPath: $.Data.projectId
              - inJsonPath: $.facilityId
                outJsonPath: $.Data.facilityId
              - inJsonPath: $.isDeleted
                outJsonPath: $.Data.isDeleted
              - inJsonPath: $.auditDetails
                outJsonPath: $.Data.auditDetails
    - topic: demo-update-project-facility-topic
      configKey: INDEX
      indexes:
        - name: demo-project-facility-index-v1
          type: project-facility
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema != 'OutsideHouseholdAssignment')]"
          timeStampField: $.auditDetails.lastModifiedTime
        - name: demo-outside-household-campaign-index-v1
          type: outside-household-campaign
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema == 'OutsideHouseholdAssignment')]"
          timeStampField: $.auditDetails.lastModifiedTime
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $.id
                outJsonPath: $.Data.id
              - inJsonPath: $.tenantId
                outJsonPath: $.Data.tenantId
              - inJsonPath: $.projectId
                outJsonPath: $.Data.projectId
              - inJsonPath: $.facilityId
                outJsonPath: $.Data.facilityId
              - inJsonPath: $.isDeleted
                outJsonPath: $.Data.isDeleted
              - inJsonPath: $.auditDetails
                outJsonPath: $.Data.auditDetails
    - topic: demo-delete-project-facility-topic
      configKey: INDEX
      indexes:
        - name: demo-project-facility-index-v1
          type: project-facility
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema != 'OutsideHouseholdAssignment')]"
          timeStampField: $.auditDetails.lastModifiedTime
        - name: demo-outside-household-campaign-index-v1
          type: outside-household-campaign
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema == 'OutsideHouseholdAssignment')]"
          timeStampField: $.auditDetails.lastModifiedTime
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $.id
                outJsonPath: $.Data.id
              - inJsonPath: $.tenantId
                outJsonPath: $.Data.tenantId
              - inJsonPath: $.projectId
                outJsonPath: $.Data.projectId
              - inJsonPath: $.facilityId
                outJsonPath: $.Data.facilityId
              - inJsonPath: $.isDeleted
                outJsonPath: $.Data.isDeleted
              - inJsonPath: $.auditDetails
                outJsonPath: $.Data.auditDetails