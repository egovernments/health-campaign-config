ServiceMaps:
  serviceName: Uploader
  version: 1.0.0
  mappings:
  - topic: chaduat-save-upload-jobs
    configKey: INDEX
    indexes:
    - name: chaduat-uploaderindex-v1
      type: jobs
      id: $.code
      isBulk: false
      jsonPath: $.UploadJob
      timeStampField: $.auditDetails.createdTime
  - topic: chaduat-update-upload-jobs
    configKey: INDEX
    indexes:
    - name: chaduat-uploaderindex-v1
      type: jobs
      id: $.code
      isBulk: false
      jsonPath: $.UploadJob
      timeStampField: $.auditDetails.createdTime
