ServiceMaps:
  serviceName: referralmanagement
  version: 1.0.0
  mappings:
  - topic: demo-transformer-producer-referral-index-v1-topic
    configKey: INDEX
    indexes:
    - name: demo-referral-index-v1
      type: referral
      id: $.referral.id
      isBulk: true
      jsonPath: $
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
        - inJsonPath: $
          outJsonPath: $.Data
      timeStampField: $.referral.auditDetails.createdTime
    - name: demo-user-sync-index-v1
      type: users
      id: $.referral.id
      isBulk: true
      jsonPath: $
      customJsonMapping:
        indexMapping:
          Data: { additionalDetails: {} }
        fieldMapping:
        - inJsonPath: $.referral.id
          outJsonPath: $.Data.referralId
        - inJsonPath: $.referral.clientAuditDetails.createdBy
          outJsonPath: $.Data.syncedUserId
        - inJsonPath: $.userName
          outJsonPath: $.Data.syncedUserName
        - inJsonPath: $.role
          outJsonPath: $.Data.role
        - inJsonPath: $.boundaryHierarchy
          outJsonPath: $.Data.boundaryHierarchy
        - inJsonPath: $.referral.clientAuditDetails.createdTime
          outJsonPath: $.Data.clientCreatedTime
        - inJsonPath: $.referral.auditDetails.lastModifiedTime
          outJsonPath: $.Data.createdTime
        - inJsonPath: $.@timestamp
          outJsonPath: $.Data.syncedTimeStamp
        - inJsonPath: $.taskDates
          outJsonPath: $.Data.taskDates
        - inJsonPath: $.syncedDate
          outJsonPath: $.Data.syncedDate
        - inJsonPath: $.campaignNumber
          outJsonPath: $.Data.campaignNumber
        - inJsonPath: $.campaignId
          outJsonPath: $.Data.campaignId
        - inJsonPath: $.additionalDetails.cycleIndex
          outJsonPath: $.Data.additionalDetails.cycleIndex
      timeStampField: $.referral.auditDetails.lastModifiedTime
  - topic: demo-delete-referral-topic
    configKey: INDEX
    indexes:
    - name: demo-referral-index-v1
      type: referral
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
  - topic: demo-transformer-producer-side-effect-index-v1-topic
    configKey: INDEX
    indexes:
    - name: demo-side-effect-index-v1
      type: side-effect
      id: $.sideEffect.id
      isBulk: true
      jsonPath: $
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
        - inJsonPath: $
          outJsonPath: $.Data
      timeStampField: $.sideEffect.auditDetails.createdTime
    - name: demo-user-sync-index-v1
      type: users
      id: $.sideEffect.id,$.sideEffect.tenantId
      isBulk: true
      jsonPath: $
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
        - inJsonPath: $.sideEffect.clientAuditDetails.createdBy
          outJsonPath: $.Data.syncedUserId
        - inJsonPath: $.userName
          outJsonPath: $.Data.syncedUserName
        - inJsonPath: $.role
          outJsonPath: $.Data.role
        - inJsonPath: $.boundaryHierarchy
          outJsonPath: $.Data.boundaryHierarchy
        - inJsonPath: $.sideEffect.clientAuditDetails.createdTime
          outJsonPath: $.Data.clientCreatedTime
        - inJsonPath: $.sideEffect.auditDetails.lastModifiedTime
          outJsonPath: $.Data.createdTime
        - inJsonPath: $.@timestamp
          outJsonPath: $.Data.syncedTimeStamp
        - inJsonPath: $.@timestamp
          outJsonPath: $.Data.@timestamp
        - inJsonPath: $.taskDates
          outJsonPath: $.Data.taskDates
        - inJsonPath: $.syncedDate
          outJsonPath: $.Data.syncedDate
        - inJsonPath: $.userAddress
          outJsonPath: $.Data.userAddress
        - inJsonPath: $.additionalDetails
          outJsonPath: $.Data.additionalDetails
      timeStampField: $.sideEffect.auditDetails.lastModifiedTime
  - topic: demo-delete-side-effect-topic
    configKey: INDEX
    indexes:
    - name: demo-side-effect-index-v1
      type: side-effect
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
  - topic: demo-transformer-producer-hfreferral-index-v1-topic
    configKey: INDEX
    indexes:
    - name: demo-hf-referral-index-v1
      type: hfreferral
      id: $.hfReferral.id
      isBulk: true
      jsonPath: $.*
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
        - inJsonPath: $
          outJsonPath: $.Data
      timeStampField: $.hfReferral.clientAuditDetails.lastModifiedTime
    - name: demo-user-sync-index-v1
      type: users
      id: $.hfReferral.id
      isBulk: true
      jsonPath: $
      customJsonMapping:
        indexMapping:
          Data: { additionalDetails: {} }
        fieldMapping:
          - inJsonPath: $.hfReferral.id
            outJsonPath: $.Data.hfReferralId
          - inJsonPath: $.hfReferral.clientAuditDetails.createdBy
            outJsonPath: $.Data.syncedUserId
          - inJsonPath: $.userName
            outJsonPath: $.Data.syncedUserName
          - inJsonPath: $.role
            outJsonPath: $.Data.role
          - inJsonPath: $.boundaryHierarchy
            outJsonPath: $.Data.boundaryHierarchy
          - inJsonPath: $.hfReferral.clientAuditDetails.createdTime
            outJsonPath: $.Data.clientCreatedTime
          - inJsonPath: $.hfReferral.auditDetails.lastModifiedTime
            outJsonPath: $.Data.createdTime
          - inJsonPath: $.taskDates
            outJsonPath: $.Data.taskDates
          - inJsonPath: $.@timestamp
            outJsonPath: $.Data.syncedTimeStamp
          - inJsonPath: $.syncedDate
            outJsonPath: $.Data.syncedDate
          - inJsonPath: $.campaignNumber
            outJsonPath: $.Data.campaignNumber
          - inJsonPath: $.campaignId
            outJsonPath: $.Data.campaignId
          - inJsonPath: $.additionalDetails.cycleIndex
            outJsonPath: $.Data.additionalDetails.cycleIndex
      timeStampField: $.hfReferral.clientAuditDetails.lastModifiedTime
  - topic: demo-delete-hfreferral-topic
    configKey: INDEX
    indexes:
    - name: demo-hf-referral-index-v1
      type: hfreferral
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
