ServiceMaps:
  serviceName: household
  version: 1.0.0
  mappings:
    - topic: demo-transformer-producer-household-member-index-v1-topic
      configKey: INDEX
      indexes:
        - name: demo-household-member-index-v1
          type: _doc
          id: $.householdMember.id
          isBulk: true
          jsonPath: $.*
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
          timeStampField: $.householdMember.clientAuditDetails.lastModifiedTime
    - topic: demo-delete-household-member-topic
      configKey: INDEX
      indexes:
        - name: demo-household-member-index-v1
          type: _doc
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime